<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark rounded square -->
  <rect width="512" height="512" rx="64" ry="64" fill="#0a0a0a"/>

  <!-- Subtle gradient overlay for depth -->
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with gradient -->
  <rect width="512" height="512" rx="64" ry="64" fill="url(#bgGrad512)"/>

  <!-- Large background X watermark -->
  <text
    x="256"
    y="316"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="396"
    fill="url(#xGrad512)"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.55"
    letter-spacing="-10">X</text>

  <!-- Red accent bar at top -->
  <rect x="80" y="72" width="352" height="10" rx="5" fill="#ef4444" opacity="0.8"/>

  <!-- "F" letter in red -->
  <text
    x="148"
    y="278"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="192"
    fill="#ef4444"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-5">F</text>

  <!-- "S" letter in blue -->
  <text
    x="364"
    y="278"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="192"
    fill="#3b82f6"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-5">S</text>

  <!-- "Stream" text below FS -->
  <text
    x="256"
    y="398"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="52"
    fill="#fafafa"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="14">STREAM</text>

  <!-- Blue accent bar at bottom -->
  <rect x="80" y="435" width="352" height="8" rx="4" fill="#3b82f6" opacity="0.7"/>
</svg>
