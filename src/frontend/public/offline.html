<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FStreamX — Offline</title>
  <meta name="theme-color" content="#1e1e1e" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 440px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .logo-wrap {
      position: relative;
      width: 100px;
      height: 40px;
      flex-shrink: 0;
    }
    .logo-x {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      color: rgba(255,255,255,0.06);
    }
    .logo-fs {
      position: absolute;
      left: 8px;
      top: 2px;
      font-size: 1.4rem;
      font-weight: 900;
      z-index: 1;
    }
    .logo-f { color: #ef4444; }
    .logo-s { color: #3b82f6; }
    .logo-label {
      position: absolute;
      left: 8px;
      bottom: -2px;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
    }
    .signal-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(239,68,68,0.12);
      border: 2px solid rgba(239,68,68,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      color: #f5f5f5;
      line-height: 1.3;
    }
    p {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.5rem;
      border-radius: 9999px;
      background: #ef4444;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #ef4444, #3b82f6);
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <span class="logo-x">X</span>
      <span class="logo-fs"><span class="logo-f">F</span><span class="logo-s">S</span></span>
      <span class="logo-label">Stream</span>
    </div>
    <div class="divider"></div>
    <div class="signal-icon">📡</div>
    <h1>You're offline</h1>
    <p>Reconnect to keep streaming — FStreamX needs an internet connection to load your content.</p>
    <button class="btn" onclick="window.location.reload()">
      ↺ Try again
    </button>
  </div>
</body>
</html>
