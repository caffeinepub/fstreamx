<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background: dark rounded square -->
  <rect width="192" height="192" rx="24" ry="24" fill="#0a0a0a"/>

  <!-- Subtle gradient overlay for depth -->
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with gradient -->
  <rect width="192" height="192" rx="24" ry="24" fill="url(#bgGrad192)"/>

  <!-- Large background X watermark -->
  <text
    x="96"
    y="118"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    fill="url(#xGrad192)"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.55"
    letter-spacing="-4">X</text>

  <!-- Red accent bar at top -->
  <rect x="32" y="28" width="128" height="4" rx="2" fill="#ef4444" opacity="0.8"/>

  <!-- "FS" text: F in red, S in blue, bold and prominent -->
  <!-- F letter -->
  <text
    x="56"
    y="104"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="72"
    fill="#ef4444"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2">F</text>

  <!-- S letter -->
  <text
    x="136"
    y="104"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="72"
    fill="#3b82f6"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2">S</text>

  <!-- "Stream" text below FS -->
  <text
    x="96"
    y="148"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="20"
    fill="#fafafa"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="5">STREAM</text>

  <!-- Blue accent bar at bottom -->
  <rect x="32" y="163" width="128" height="3" rx="1.5" fill="#3b82f6" opacity="0.7"/>
</svg>
